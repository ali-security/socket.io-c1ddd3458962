name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Run only the tests matching this name filter (empty = full suite)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24

    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: changeit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Compile each package
        run: npm run compile --workspaces --if-present

      - name: Run tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            cd packages/socket.io-parser
            npx mocha --reporter dot --bail --grep "${{ inputs.test-filter }}" test/index.js
          else
            npm test --workspaces
          fi

      - name: Run tests with uws (engine.io)
        run: npm run test:uws --workspace=engine.io
        if: ${{ matrix.node-version == '18' }}

      - name: Run tests with fetch instead of XHR (engine.io-client)
        run: npm run test:node-fetch --workspace=engine.io-client
        if: ${{ matrix.node-version == '18' }}

      - name: Run tests with Node.js native WebSocket (engine.io-client)
        run: npm run test:node-builtin-ws --workspace=engine.io-client
        if: ${{ matrix.node-version == '22' }}

      - name: Pack socket.io-parser
        run: npm pack --workspace=socket.io-parser
        if: ${{ matrix.node-version == '24' }}

      - name: Upload socket.io-parser tarball
        uses: actions/upload-artifact@v4
        if: ${{ matrix.node-version == '24' }}
        with:
          name: socket.io-parser-tgz
          path: socket.io-parser-4.2.5.tgz
          if-no-files-found: error
